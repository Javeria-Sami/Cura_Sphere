name: CuraSphere HMS CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'feature/**' ]
  pull_request:
    branches: [ main, master, develop, 'feature/**' ]

jobs:
  backend-build-test:
    name: Backend Build & Unit/Integration Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/CuraSphere.slnx

      - name: Build Backend Solution & Test Projects
        run: dotnet build backend/CuraSphere.slnx -c Release

      - name: Run Backend Unit Tests
        run: dotnet run --project backend/tests/CuraSphere.UnitTests/CuraSphere.UnitTests.csproj -c Release --no-build

      - name: Run Backend Integration Tests
        run: dotnet run --project backend/tests/CuraSphere.IntegrationTests/CuraSphere.IntegrationTests.csproj -c Release --no-build

      - name: Build Backend Docker Image (Container Build Gate)
        run: docker build -t curasphere-api:ci-test -f backend/CuraSphere.Api/Dockerfile backend/

  frontend-build-test:
    name: Frontend Vitest & TypeScript Build Check (React 18 + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint Code Analysis
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npx vitest run

      - name: Run TypeScript Type Checker
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Production Web Bundle
        working-directory: ./frontend
        run: npm run build
